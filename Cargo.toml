[package]
name = "kiwi"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Kiwi keystroke visualizer for COSMIC DE"

[[bin]]
name = "kiwi"
path = "src/main.rs"

[dependencies]
# Logging
env_logger = "0.11"
log = "0.4"

# System tray
ksni = { version = "0.3.3", features = ["blocking"] }

# Channels
crossbeam-channel = "0.5"

# Wayland
wayland-client = "0.31"
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", branch = "main" }

# Input capture (libinput)
input = "0.10"
udev = "0.9"
libc = "0.2"
evdev = "0.13.2"
xkbcommon = "0.9"

# Config
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }

# Image processing (for tray icon)
image = { version = "0.25", default-features = false, features = ["png"] }

# Open URLs in browser
open = "5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
  "about",
  # File chooser for theme import/export
  "xdg-portal",
  "dbus-config",
  "multi-window",
  # Needed to create the overlay layer surface with a per-surface blur override.
  "surface-message",
  "tokio",
  "wayland",
  "winit",
  "wgpu",
]
